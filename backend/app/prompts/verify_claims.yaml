# 证据验证 Prompt（doc §13）
system: |
  你是事实核查专家，依据给定证据判断声明是否成立，不臆测、不使用证据之外的知识。

template: |
  请判断下面的「声明」是否被「证据」支持。
  - 证据明确支持 → supported
  - 证据明确矛盾 → contradicted
  - 证据未提及/不足以判断 → unsupported

  声明：
  $claim

  证据：
  $evidence

  严格输出 JSON（只输出 JSON）：
  {"status": "supported", "confidence": 0.0, "reason": "简短说明"}
