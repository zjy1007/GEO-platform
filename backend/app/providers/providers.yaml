# Provider registry (doc §6 / §3).
# API keys are referenced by env var name only — NEVER store secrets here.
# Model names are placeholders: verify exact available model IDs against each
# vendor's official docs before P1 (doc §3 warns not to hardcode guessed names).
#
# channel: which channels a provider supports.
#   api → OpenAI-compatible / vendor SDK (analysis tasks, P1)
#   web → account pool via Playwright (real exposure + citations, P2)

providers:
  deepseek:
    type: openai_compatible
    channels: [api, web]
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-chat        # TODO: verify exact model id
    timeout_sec: 60
    max_concurrency: 5
    qps: 2

  qwen:
    type: openai_compatible
    channels: [api]
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    default_model: qwen-plus            # TODO: verify exact model id
    timeout_sec: 60
    max_concurrency: 5
    qps: 2

  zhipu:
    type: openai_compatible
    channels: [api]
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    default_model: glm-4-plus           # TODO: verify exact model id
    timeout_sec: 60
    max_concurrency: 5
    qps: 2

  kimi:
    type: openai_compatible
    channels: [api]
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    default_model: moonshot-v1-8k       # TODO: verify exact model id
    timeout_sec: 60
    max_concurrency: 3
    qps: 1

  # --- web-only platforms (no equivalent API; account pool in P2) ---
  yuanbao:
    type: web_only
    channels: [web]
    note: 腾讯元宝 ≠ 混元 API；网页/App 账号池采集，单请求返回正文+引用
  nami:
    type: web_only
    channels: [web]
    note: 纳米AI（360 搜索 App），账号池采集；搜索结果与正文可能分两请求，需都拦
  doubao:
    type: web_only
    channels: [web]
    note: 联网豆包 App 体验，账号池采集；搜索结果与正文分两请求需都拦（方舟 API 仅作分析兜底、无引用，需 endpoint id ep-xxxx）

# Account-pool per-account daily quotas (web channel, doc §14).
account_quota:
  deepseek_web: { per_account_daily: 40 }
  yuanbao_web: { per_account_daily: 30 }
  nami_web: { per_account_daily: 30 }     # 补齐 nami 账号池配额
  doubao_web: { per_account_daily: 30 }
